name: Build Android APK

on:
  push:
    branches: [arena/01a0a3df-beasy-crop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare www
        run: mkdir -p www && cp index.html www/index.html
      - name: Install npm deps
        run: npm install
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BeasyCrop.apk
          ls -lh dist/BeasyCrop.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeasyCrop
          path: dist/BeasyCrop.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: Beasy Crop v3.0 APK
          body: |
            Phone pe install karo:
            1. BeasyCrop.apk download karo
            2. Chrome/Files se open karo
            3. Unknown sources allow karo
            4. Install
          files: dist/BeasyCrop.apk
          make_latest: true
